name: ci
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  no-nav2-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any dependency or source mentions nav2
        run: |
          # Targets are limited to manifests, lock and sources so this file and docs cannot trigger it.
          if grep -rIniE --include=pixi.toml --include=pixi.lock --include=package.xml \
              --include=CMakeLists.txt --include=setup.py --include='*.py' --include='*.cpp' \
              --include='*.hpp' --include='*.launch.xml' --include='*.launch.yaml' \
              --exclude-dir=.pixi --exclude-dir=build --exclude-dir=install --exclude-dir=.git \
              'nav2[_-]' .; then
            echo "nav2 dependency is forbidden" >&2
            exit 1
          fi

  build-test:
    needs: no-nav2-dependency
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - run: pixi run lint
      - run: pixi run test
      # `pixi run test` stops before `colcon test-result` on failure, so print which tests failed.
      - name: Show failed tests
        if: failure()
        run: pixi run colcon test-result --verbose

  # apt environment of the robot (docker/Dockerfile). The pixi jobs above stay the reference for development.
  docker:
    needs: no-nav2-dependency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # mode=min: only the apt layer is reused; every layer after `COPY src` changes with each commit.
      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: lightnav:test
          cache-from: type=gha,scope=lightnav-test
          cache-to: type=gha,mode=min,scope=lightnav-test
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: lightnav:runtime
          cache-from: type=gha,scope=lightnav-runtime
          cache-to: type=gha,mode=min,scope=lightnav-runtime
      # The ROS_HOME of the image (/tmp/ros_home) hides the rosdep cache of the base image, so remove it for this command only
      # (an empty ROS_HOME does not work: rosdep then reports it is not initialized).
      # rviz2 is a GUI dependency of lightnav_sim and is not in the image.
      - name: rosdep check (a package.xml dependency missing from the Dockerfile fails here)
        run: |
          docker run --rm --entrypoint sh lightnav:test -c \
            'env -u ROS_HOME rosdep check --from-paths src --ignore-src --skip-keys rviz2'
      # Production Fast DDS XML, so --ipc host is not used: a participant takes about 16.75 MiB of /dev/shm.
      - name: colcon test in the image
        run: docker run --rm --shm-size=1g lightnav:test
      - name: Runtime image contains the workspace and no sources
        run: |
          docker run --rm lightnav:runtime bash -c \
            'for package_name in lightnav_bringup lightnav_controller lightnav_safety_gate lightnav_localization; do ros2 pkg prefix "$package_name"; done; test ! -e /ws/src && test ! -e /ws/build'
          # The robot runs as a non-root uid: ROS_LOG_DIR / ROS_HOME must be writable and dds_check must accept it.
          docker run --rm --user 1000:1000 -e TSUKUCHALLE_UID=1000 lightnav:runtime ros2 pkg prefix lightnav_controller
          size_bytes=$(docker save lightnav:runtime | gzip | wc -c)
          echo "lightnav:runtime compressed: $((size_bytes / 1024 / 1024)) MiB"
      # compose.yaml: no default uid/gid (a missing .env must stop `up`, see docker/.env.example), safety_gate defaults to true.
      - name: compose config stops without TSUKUCHALLE_UID / GID and passes with them
        run: |
          if env -u TSUKUCHALLE_UID -u TSUKUCHALLE_GID -u LIGHTNAV_SAFETY_GATE docker compose -f docker/compose.yaml config > /dev/null 2> compose-error.txt; then
            echo "compose config passed without TSUKUCHALLE_UID / TSUKUCHALLE_GID" >&2
            exit 1
          fi
          grep -q 'TSUKUCHALLE_UID' compose-error.txt
          env -u LIGHTNAV_SAFETY_GATE TSUKUCHALLE_UID=1000 TSUKUCHALLE_GID=1000 \
            docker compose -f docker/compose.yaml config --format json > compose.json
          jq -e '.services.nav.user == "1000:1000" and .services.nav.environment.TSUKUCHALLE_UID == "1000"' compose.json
          jq -e '.services.nav.command[4] == "safety_gate:=true"' compose.json
          LIGHTNAV_SAFETY_GATE=false TSUKUCHALLE_UID=1000 TSUKUCHALLE_GID=1000 \
            docker compose -f docker/compose.yaml config --format json | jq -e '.services.nav.command[4] == "safety_gate:=false"'
      - name: Every compose service runs a launch file that exists in the runtime image
        run: |
          service_count=$(jq '.services | length' compose.json)
          launch_services=$(jq -r '.services[] | select(.command[0] == "ros2" and .command[1] == "launch") | "\(.command[2]) \(.command[3])"' compose.json)
          test "$(echo "$launch_services" | wc -l)" -eq "$service_count"
          echo "$launch_services" | while read -r package_name launch_file; do
            docker run --rm --entrypoint bash lightnav:runtime -lc \
              "test -f \"\$(ros2 pkg prefix $package_name)/share/$package_name/launch/$launch_file\""
          done
      - name: deploy.sh refuses to run without destinations or with a dirty tree, and has valid syntax
        run: |
          bash -n scripts/deploy.sh
          status=0; env -u LIGHTNAV_BUILD_HOST -u LIGHTNAV_ROBOT_HOST scripts/deploy.sh > /dev/null 2>&1 || status=$?
          test "$status" -eq 2
          touch untracked-file-for-the-dirty-check
          status=0; LIGHTNAV_BUILD_HOST=unused LIGHTNAV_ROBOT_HOST=unused scripts/deploy.sh > /dev/null 2>&1 || status=$?
          test "$status" -eq 1
