name: ci
on:
  pull_request:
  push:
    branches: [develop, main]

# build-test (ubuntu-latest) and docker run on the self-hosted runners (one ThinkCentre, label tsukuchalle-pixi /
# tsukuchalle-docker) for pushes and for pull requests from branches of this repository; with this file, pull requests
# from forks stay on GitHub-hosted runners. This condition is not the protection: a fork runs its own copy of this file
# and can point runs-on at the self-hosted labels. What protects the machine is the repository setting that a person
# approves every workflow run of an outside contributor (AGENTS.md: read the .github/ diff before approving).
# One runner per label keeps those jobs serial: the pixi tests use the fixed ROS_DOMAIN_ID 44 on the host network.
env:
  SELF_HOSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  no-nav2-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any dependency or source mentions nav2
        run: |
          # Targets are limited to manifests, lock and sources so this file and docs cannot trigger it.
          if grep -rIniE --include=pixi.toml --include=pixi.lock --include=package.xml \
              --include=CMakeLists.txt --include=setup.py --include='*.py' --include='*.cpp' \
              --include='*.hpp' --include='*.launch.xml' --include='*.launch.yaml' \
              --exclude-dir=.pixi --exclude-dir=build --exclude-dir=install --exclude-dir=.git \
              'nav2[_-]' .; then
            echo "nav2 dependency is forbidden" >&2
            exit 1
          fi

  build-test:
    needs: no-nav2-dependency
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    # The job name stays "build-test (ubuntu-latest)" (a required check) whichever runner it lands on.
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","tsukuchalle-pixi"]') || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          # On the self-hosted runner the package cache of rattler stays on the disk; the GitHub cache is only a download.
          cache: ${{ !(matrix.os == 'ubuntu-latest' && env.SELF_HOSTED == 'true') }}
      - run: pixi run lint
      - run: pixi run test
      # `pixi run test` stops before `colcon test-result` on failure, so print which tests failed.
      - name: Show failed tests
        if: failure()
        run: pixi run colcon test-result --verbose

  # apt environment of the robot (docker/Dockerfile). The pixi jobs above stay the reference for development.
  docker:
    needs: no-nav2-dependency
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","tsukuchalle-docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Self-hosted: the docker driver of the local dockerd (containerd image store) keeps every layer between runs and
      # loads the images without an export, so the GitHub cache is not used there (the docker driver cannot export it).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ env.SELF_HOSTED == 'true' && 'docker' || 'docker-container' }}
      # mode=min: only the apt layer is reused; every layer after `COPY src` changes with each commit.
      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test
          load: true
          tags: lightnav:test
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha,scope=lightnav-test' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=min,scope=lightnav-test' || '' }}
      - name: Build the runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: lightnav:runtime
          cache-from: ${{ env.SELF_HOSTED != 'true' && 'type=gha,scope=lightnav-runtime' || '' }}
          cache-to: ${{ env.SELF_HOSTED != 'true' && 'type=gha,mode=min,scope=lightnav-runtime' || '' }}
      # The ROS_HOME of the image (/tmp/ros_home) hides the rosdep cache of the base image, so remove it for this command only
      # (an empty ROS_HOME does not work: rosdep then reports it is not initialized).
      # rviz2 is a GUI dependency of lightnav_sim and is not in the image.
      - name: rosdep check (a package.xml dependency missing from the Dockerfile fails here)
        run: |
          docker run --rm --entrypoint sh lightnav:test -c \
            'env -u ROS_HOME rosdep check --from-paths src --ignore-src --skip-keys rviz2'
      # Production Fast DDS XML, so --ipc host is not used: a participant takes about 16.75 MiB of /dev/shm.
      - name: colcon test in the image
        run: docker run --rm --shm-size=1g lightnav:test
      - name: Runtime image contains the workspace and no sources
        run: |
          docker run --rm lightnav:runtime bash -c \
            'for package_name in lightnav_bringup lightnav_controller lightnav_safety_gate lightnav_localization; do ros2 pkg prefix "$package_name"; done; test ! -e /ws/src && test ! -e /ws/build'
          # The robot runs as a non-root uid: ROS_LOG_DIR / ROS_HOME must be writable and dds_check must accept it.
          docker run --rm --user 1000:1000 -e TSUKUCHALLE_UID=1000 lightnav:runtime ros2 pkg prefix lightnav_controller
          size_bytes=$(docker save lightnav:runtime | gzip | wc -c)
          echo "lightnav:runtime compressed: $((size_bytes / 1024 / 1024)) MiB"
      # compose.yaml: no default uid/gid (a missing .env must stop `up`, see docker/.env.example), safety_gate defaults to true.
      - name: compose config stops without TSUKUCHALLE_UID / GID and passes with them
        run: |
          if env -u TSUKUCHALLE_UID -u TSUKUCHALLE_GID -u LIGHTNAV_SAFETY_GATE docker compose -f docker/compose.yaml config > /dev/null 2> "$RUNNER_TEMP/compose-error.txt"; then
            echo "compose config passed without TSUKUCHALLE_UID / TSUKUCHALLE_GID" >&2
            exit 1
          fi
          grep -q 'TSUKUCHALLE_UID' "$RUNNER_TEMP/compose-error.txt"
          env -u LIGHTNAV_SAFETY_GATE TSUKUCHALLE_UID=1000 TSUKUCHALLE_GID=1000 \
            docker compose -f docker/compose.yaml config --format json > "$RUNNER_TEMP/compose.json"
          jq -e '.services.nav.user == "1000:1000" and .services.nav.environment.TSUKUCHALLE_UID == "1000"' "$RUNNER_TEMP/compose.json"
          jq -e '.services.nav.command[4] == "safety_gate:=true"' "$RUNNER_TEMP/compose.json"
          LIGHTNAV_SAFETY_GATE=false TSUKUCHALLE_UID=1000 TSUKUCHALLE_GID=1000 \
            docker compose -f docker/compose.yaml config --format json | jq -e '.services.nav.command[4] == "safety_gate:=false"'
      # localization: SIGINT is what makes `ros2 launch` shut the node down (SIGTERM kills it without saving the map), a tty/stdin
      # would stop launch from forwarding SIGINT, and sigterm + sigkill timeouts must fit in stop_grace_period. .env.example must work as .env.
      - name: compose localization service stops with SIGINT and .env.example is valid
        run: |
          env -u TSUKUCHALLE_UID -u TSUKUCHALLE_GID -u LIGHTNAV_LOCALIZATION_MODE \
            docker compose -f docker/compose.yaml --env-file docker/.env.example config --format json > "$RUNNER_TEMP/compose-example.json"
          jq -e '.services.nav.user == "1000:1000" and .services.localization.user == "1000:1000"' "$RUNNER_TEMP/compose-example.json"
          jq -e '.services.localization | .stop_signal == "SIGINT" and .stop_grace_period == "1m0s" and (has("tty") | not) and (has("stdin_open") | not)' "$RUNNER_TEMP/compose-example.json"
          jq -e '.services.localization.command | index("mode:=localization") != null and index("map_file:=/data/map/map.pcd") != null' "$RUNNER_TEMP/compose-example.json"
          jq -e '.services.localization.volumes | map(.target) | sort == ["/config/localization_indoor.yaml", "/config/robot.yaml", "/data"]' "$RUNNER_TEMP/compose-example.json"
          # params_file defaults to robot.yaml; LIGHTNAV_LOCALIZATION_PARAMS selects a file that is mounted (indoors: no GNSS, Issue #43 section 12).
          jq -e '.services.localization.command | index("params_file:=/config/robot.yaml") != null' "$RUNNER_TEMP/compose-example.json"
          env -u TSUKUCHALLE_UID -u TSUKUCHALLE_GID LIGHTNAV_LOCALIZATION_PARAMS=/config/localization_indoor.yaml \
            docker compose -f docker/compose.yaml --env-file docker/.env.example config --format json > "$RUNNER_TEMP/compose-indoor.json"
          jq -e '.services.localization as $service | ("params_file:=/config/localization_indoor.yaml" | IN($service.command[])) and ($service.volumes | map(select(.source | endswith("/config/localization_indoor.yaml")) | .target) == ["/config/localization_indoor.yaml"])' "$RUNNER_TEMP/compose-indoor.json"
          jq -e '.services.localization.command | (map(select(startswith("sigterm_timeout:=")) | ltrimstr("sigterm_timeout:=") | tonumber) | add) + (map(select(startswith("sigkill_timeout:=")) | ltrimstr("sigkill_timeout:=") | tonumber) | add) < 60' "$RUNNER_TEMP/compose-example.json"
          env -u TSUKUCHALLE_UID -u TSUKUCHALLE_GID LIGHTNAV_LOCALIZATION_MODE=mapping \
            docker compose -f docker/compose.yaml --env-file docker/.env.example config --format json | jq -e '.services.localization.command | index("mode:=mapping") != null'
      - name: Every compose service runs a launch file that exists in the runtime image
        run: |
          service_count=$(jq '.services | length' "$RUNNER_TEMP/compose.json")
          launch_services=$(jq -r '.services[] | select(.command[0] == "ros2" and .command[1] == "launch") | "\(.command[2]) \(.command[3])"' "$RUNNER_TEMP/compose.json")
          test "$(echo "$launch_services" | wc -l)" -eq "$service_count"
          echo "$launch_services" | while read -r package_name launch_file; do
            docker run --rm --entrypoint bash lightnav:runtime -lc \
              "test -f \"\$(ros2 pkg prefix $package_name)/share/$package_name/launch/$launch_file\""
          done
      - name: deploy.sh refuses to run without destinations or with a dirty tree, and has valid syntax
        run: |
          bash -n scripts/deploy.sh
          status=0; env -u LIGHTNAV_BUILD_HOST -u LIGHTNAV_ROBOT_HOST scripts/deploy.sh > /dev/null 2>&1 || status=$?
          test "$status" -eq 2
          # The earlier steps write to RUNNER_TEMP, so the tree is clean here: the same call must get past the dirty check
          # and fail at the first ssh (exit 255; a failed fetch would be 128), and only the untracked file below makes it exit 1.
          test -z "$(git status --porcelain)"
          status=0; LIGHTNAV_BUILD_HOST=unused LIGHTNAV_ROBOT_HOST=unused scripts/deploy.sh > /dev/null 2>&1 || status=$?
          test "$status" -eq 255
          touch untracked-file-for-the-dirty-check
          status=0; LIGHTNAV_BUILD_HOST=unused LIGHTNAV_ROBOT_HOST=unused scripts/deploy.sh > /dev/null 2>&1 || status=$?
          test "$status" -eq 1
