name: ci
on:
  pull_request:
  push:
    branches: [develop, main]

env:
  ROS_LOCALHOST_ONLY: "1"

jobs:
  no-nav2-dependency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any manifest depends on nav2
        run: |
          # Only manifests are searched, so this file and docs cannot trigger it.
          if grep -rIn --include=package.xml --include=CMakeLists.txt --include=pixi.toml \
              --exclude-dir=.pixi --exclude-dir=build --exclude-dir=install --exclude-dir=.git \
              'nav2_' .; then
            echo "nav2 dependency is forbidden" >&2
            exit 1
          fi

  build-test:
    needs: no-nav2-dependency
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true
      - run: pixi run lint
      - run: pixi run test
