# Parameters of the nodes started by lightnav_bringup/robot.launch.py and of localization_node (started by
# lightnav_localization/launch/localization.launch.py with this file as params_file). The top-level keys are the node names.
# Mounted read-only at /config/robot.yaml by docker/compose.yaml; scripts/deploy.sh stops when the copy on the
# robot differs from this file, so a value changed on site goes back through a PR.
#
# points_qos_reliability of obstacle_monitor also stays at its default (reliable) until tsukuchalle_drivers #19 is in.

safety_gate_node:
  ros__parameters:
    v_max_ceiling: 0.8
    w_max_ceiling: 0.6

obstacle_monitor:
  ros__parameters:
    # TF comes from the description container (base_footprint); the code default is base_link.
    base_frame: base_footprint
    # Issue #1, user decision 2026-11-09: stop 0.3 m ahead of base_footprint (the body front is about 0.2 m ahead, so
    # about 0.1 m from the front). The code default is 1.0 m. stop_zone_y_half_m and the slow zone keep their defaults.
    stop_zone_x_m: 0.3
    # Issue #1, user decision 2026-11-09: 0.3 m indoors and outdoors (default 0.5 m closed the passage in a room).
    # The body is about 0.30 m wide, so about 0.15 m stays between an obstacle and the side of the body.
    inflation_radius_m: 0.3

controller_node:
  ros__parameters:
    # First runs only (Issue #35, tentative decision 6). The code defaults stay as they are.
    v_max: 0.3
    w_max: 0.4
    # The controller refuses to configure without it (no code default, since it depends on the width of the course).
    # TENTATIVE: 1.5 is the value of the contract table of Issue #1, not a measured one. Decide it from the width of
    # the real course before the first run on a path (before 1c).
    max_path_deviation_m: 1.5
    # Must equal obstacle_monitor.base_frame above: the controller drops every local_grid whose frame_id differs
    # (Issue #1). test_robot_config_frames.py of lightnav_bringup checks that the two stay equal.
    grid_frame: base_footprint

localization_node:
  ros__parameters:
    # Issue #59, user decision 2026-11-09: accept map-match yaw corrections up to 2.0 rad (code default 0.2 rad
    # rejected correct corrections after wheel slip, so the yaw stayed off).
    map_gate_rotation_rad: 2.0
    # GNSS input contract (Issue #43 section 4.3, decisions D1, D8, D10). Mapping and localization use the same topic.
    gps_topic: /rtk/fix_all
    # 1 = SBAS (Float) or better. The single-point solution (status 0) is no GNSS observation: it does not
    # initialise, set the mapping origin or enter the graph, and it is not counted as a rejection.
    gps_min_status: 1
    # The receiver publishes 5 Hz; the graph takes at most one fix per second (thinned by header.stamp).
    gps_min_interval_s: 1.0
    # With gps_min_status 1 this is reached by a Float fix (sigma 1.0 m from gps_std_m_by_status).
    init_gps_max_std_m: 1.5
    # Same directory as the map localization reads: back up /data/map before starting mapping.
    map_output_dir: /data/map
    base_frame: base_footprint
    gps_frame: gnss
