# Parameters of the nodes started by lightnav_bringup/robot.launch.py and of localization_node (started by
# lightnav_localization/launch/localization.launch.py with this file as params_file). The top-level keys are the node names.
# Mounted read-only at /config/robot.yaml by docker/compose.yaml; scripts/deploy.sh stops when the copy on the
# robot differs from this file, so a value changed on site goes back through a PR.
#
# points_qos_reliability of obstacle_monitor also stays at its default (reliable) until tsukuchalle_drivers #19 is in.

safety_gate_node:
  ros__parameters:
    v_max_ceiling: 0.8
    w_max_ceiling: 0.6

obstacle_monitor:
  ros__parameters:
    # TF comes from the description container (base_footprint); the code default is base_link.
    base_frame: base_footprint
    # Issue #1, user decision 2026-11-09: stop 0.3 m ahead of base_footprint (the body front is about 0.2 m ahead, so
    # about 0.1 m from the front). The code default is 1.0 m. stop_zone_y_half_m and the slow zone keep their defaults.
    stop_zone_x_m: 0.3
    # Issue #1, user decision 2026-11-09: 0.3 m indoors and outdoors (default 0.5 m closed the passage in a room).
    # The body is about 0.30 m wide, so about 0.15 m stays between an obstacle and the side of the body.
    inflation_radius_m: 0.3

controller_node:
  ros__parameters:
    # First runs only (Issue #35, tentative decision 6). The code defaults stay as they are.
    v_max: 0.3
    w_max: 0.4
    stuck_rotate_after_s: 2.0
    rotate_in_place_heading_threshold_rad: 1.2
    # The controller refuses to configure without it (no code default, since it depends on the width of the course).
    # TENTATIVE: 1.5 is the value of the contract table of Issue #1, not a measured one. Decide it from the width of
    # the real course before the first run on a path (before 1c).
    max_path_deviation_m: 1.5
    # Must equal obstacle_monitor.base_frame above: the controller drops every local_grid whose frame_id differs
    # (Issue #1). test_robot_config_frames.py of lightnav_bringup checks that the two stay equal.
    grid_frame: base_footprint

localization_node:
  ros__parameters:
    # Issue #59, user decision 2026-11-09: accept map-match yaw corrections up to 2.0 rad (code default 0.2 rad
    # rejected correct corrections after wheel slip, so the yaw stayed off).
    map_gate_rotation_rad: 2.0
    # GNSS input contract (Issue #43 section 4.3, decisions D8, D10). Mapping and localization use the same topic.
    # Issue #93, user decision 2026-11-27: listen to /fix_all. The receiver driver publishes the single-point solution
    # (status 0) only on /fix_all, and /fix_all also carries the Float / Fix solution, so this one topic is enough.
    # /fix has Float / Fix only (Issue #88, user decision 2026-11-25: the receiver runs the CLAS firmware).
    # /rtk/fix_all (RTKLIB with a base station) is not published while the rtk containers are stopped.
    # The driver notes that /fix_all is for display only: this decision changes that for localization.
    gps_topic: /fix_all
    # Issue #93, user decision 2026-11-27: 0 = the single-point solution is used too, for the mapping origin, the
    # initial alignment and the graph (it enters the graph with sigma 2.0 m from gps_std_m_by_status; decision D8 of
    # Issue #43 is replaced). gps_topic must be /fix_all for this to take effect: /fix never carries status 0.
    gps_min_status: 0
    # The graph takes at most one fix per second (thinned by header.stamp); the CLAS receiver publishes 1 Hz.
    gps_min_interval_s: 1.0
    # Issue #93, user decision 2026-11-27: 3.0 m (the code default, was 1.5). The single-point solution counts as sigma
    # 2.0 m from gps_std_m_by_status, so 1.5 would use no fix for the mapping origin or the initial alignment.
    init_gps_max_std_m: 3.0
    # Issue #93, user decision 2026-11-27 (value TENTATIVE, K1): the mapping origin and the initial alignment wait
    # while the std that the receiver reports for a fix is above 10 m (last_error says so). In the recording of
    # Issue #93 this holds back about the first 3.5 minutes after power-on. 0 = off. The sigma that enters the graph
    # does not change. A fix without a reported std is not refused by this.
    init_gps_reported_std_max_m: 10.0
    # Issue #93, user decision 2026-11-27: weak absolute references on every node. Tilt: "the body is nearly level"
    # (sigma 0.3 rad), mapping and localization. Height: "the height stays near the first node" (sigma 2.0 m),
    # mapping only. Without them the height drifted by +-8 m over a 650 m run without GNSS (2026-11-25).
    absolute_sigma_tilt_rad: 0.3
    absolute_sigma_z_m: 2.0
    # Issue #93, user decision 2026-11-27: trust the yaw from the wheels less (sigma grows 0.2 rad per metre; the code
    # default is 0.01). Outdoors with GNSS only: docker/config/localization_indoor.yaml keeps the default.
    wheel_sigma_yaw_per_m: 0.2
    # Issue #93, user decision 2026-11-27: ~/save_map closes loops between stages 2 and 3 of the map save. The stop of
    # the container does not (its 45 s limit is too short): call save_map before stopping to get a map with loops.
    # lidar_odom_gate_yaw_rad stays at the code default 0.1 (0.5 made another scene worse).
    loop_closure_enabled: true
    # Same directory as the map localization reads: back up /data/map before starting mapping.
    map_output_dir: /data/map
    base_frame: base_footprint
    gps_frame: gnss
