[workspace]
name = "lightweight-nav-stack"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
ros-jazzy-ros-base = "*"
colcon-common-extensions = "*"
setuptools = "*"
pytest = ">=8,<9"
pyyaml = "*"
numpy = "*"
eigen = "*"
cmake = "*"
compilers = "*"
ninja = "*"
make = "*"
pkg-config = "*"
ruff = "*"
# Dependencies for lightnav_localization (issue 2)
ros-jazzy-gtsam = "*"
tbb-devel = "*"
geographiclib-cpp = "*"

[feature.hardware.dependencies]
ros-jazzy-velodyne = "*"
ros-jazzy-nmea-navsat-driver = "*"

[feature.eval.dependencies]
rosbags = "*"
evo = "*"
matplotlib = "*"

[environments]
hardware = ["hardware"]
eval = ["eval"]

[activation]
# Skipped when install/ does not exist yet (before the first build).
scripts = ["install/local_setup.sh"]
env = { ROS_DOMAIN_ID = "43", ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST" }

[tasks]
# No --symlink-install: it fails with recent setuptools.
build = "colcon build --merge-install --base-paths src --cmake-args -DCMAKE_BUILD_TYPE=Release -DPython3_FIND_STRATEGY=LOCATION -DPython3_ROOT_DIR=$CONDA_PREFIX -DPython3_FIND_FRAMEWORK=NEVER"
# Tests run on domain 44 (localhost only), never on 42 (robot) or 43 (GUI / default), so a running GUI
# cannot mix TF into tests. The task env overrides the [activation] env (checked with pixi 0.59), and the
# plugin aborts the run unless the value is exactly 44. colcon and SIP strip DYLD_LIBRARY_PATH, so it is
# passed as LIGHTNAV_DYLD_LIBRARY_PATH and restored by the plugin (see CLAUDE.md).
test = { cmd = "PYTHONPATH=$PIXI_PROJECT_ROOT/tools/pytest_plugins:$PYTHONPATH colcon test --merge-install --base-paths src --return-code-on-test-failure && colcon test-result --verbose", depends-on = ["build"], env = { ROS_DOMAIN_ID = "44", ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST", PYTEST_PLUGINS = "lightnav_test_environment", LIGHTNAV_DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/lib" } }
lint = "ruff check src"
# macOS SIP strips DYLD_LIBRARY_PATH set by activation, so pass it as task env.
# `pixi run ros2 run|launch ...` resolves to this task, so follow-up PRs need nothing special.
ros2 = { cmd = "ros2", env = { DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/lib" } }
# The only way to reach a real robot (domain 42). Needs human approval every time; agents must not use it.
ros2-robot = { cmd = "ros2", env = { ROS_DOMAIN_ID = "42", ROS_AUTOMATIC_DISCOVERY_RANGE = "SUBNET", DYLD_LIBRARY_PATH = "$PIXI_PROJECT_ROOT/install/lib" } }
