localization_node:
  ros__parameters:
    mode: localization
    map_file: ""
    map_yaml: ""
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    gps_frame: gnss
    wheel_odom_topic: /wheel/odom
    points_topic: /velodyne_points
    gps_topic: /gps/fix
    publish_tf: true
    status_rate_hz: 2.0
    diagnostics_cpu_warn_percent: 200.0
    diagnostics_memory_warn_mb: 2048.0
    last_error_hold_s: 10.0
    num_threads: 4

    # Initial alignment (Issue #2 section 8, localization mode).
    init_gps_max_std_m: 3.0
    # GNSS input contract (Issue #43 section 4.3). The defaults keep every fix; docker/config/robot.yaml sets 1 and 1.0.
    gps_min_status: -1
    gps_min_interval_s: 0.0
    init_scan_count: 3
    init_yaw_step_deg: 15.0
    init_coarse_corr_m: 2.0
    init_fine_corr_m: 0.5
    init_inlier_ratio_min: 0.6

    # Mapping mode (Issue #2 sections 8-9).
    map_output_dir: ""
    map_voxel_size_m: 0.2
    keyframe_cloud_voxel_m: 0.25
    batch_max_iterations: 100
    init_travel_m: 3.0
    allow_mapping_without_gps: false

    # State machine and input timeouts.
    wheel_timeout_s: 0.2
    scan_timeout_s: 0.5
    gps_timeout_s: 3.0
    tracking_window_s: 5.0
    lost_position_std_m: 2.0
    odom_only_max_distance_m: 50.0
    odom_only_max_s: 60.0
    drift_rate: 0.02

    # LiDAR odometry.
    voxel_size_m: 0.5
    submap_keyframes: 10
    submap_voxel_size_m: 0.25
    lidar_odom_max_iterations: 20
    lidar_odom_inlier_ratio_min: 0.6
    lidar_odom_gate_translation_m: 0.3
    lidar_odom_gate_translation_ratio: 0.2
    lidar_odom_gate_yaw_rad: 0.1
    lidar_odom_slip_gate_yaw_rad: 0.35
    lidar_odom_slip_wheel_yaw_rate_rad_s: 0.05
    lidar_odom_covariance_scale: 1.0
    lidar_odom_sigma_floor_m: 0.02
    lidar_odom_sigma_floor_rad: 0.005

    # Wheel factor.
    wheel_sigma_translation_per_m: 0.02
    wheel_yaw_slip_threshold_rad: 0.1
    wheel_robust_kernel: huber
    wheel_robust_k: 8.0
    wheel_sigma_yaw_per_rad: 0.1
    wheel_sigma_yaw_per_m: 0.01
    planar_sigma_z_per_m: 0.05
    planar_sigma_tilt_rad: 0.05

    # Prior-map matching.
    map_submap_rebuild_distance_m: 50.0
    keyframe_distance_m: 1.0
    keyframe_time_s: 1.0
    match_rate_hz: 2.0
    map_max_correspondence_distance_m: 1.0
    map_max_iterations: 30
    map_inlier_ratio_min: 0.5
    map_gate_translation_m: 1.0
    map_gate_rotation_rad: 0.2
    map_covariance_scale: 1.0
    map_sigma_floor_m: 0.05
    map_sigma_floor_rad: 0.01
    degeneracy_ratio: 0.05

    # Pose graph.
    window_s: 30.0
    huber_k: 1.0

    # GPS.
    gps_std_m_by_status: [2.0, 1.0, 0.3]
    gps_max_hdop: 3.0
    gps_gate_mahalanobis: 3.0
    gps_trusted_std_m: 0.3
    gps_absolute_gate_m: 2.0
    gps_conflict_window: 10
    gps_conflict_ratio: 0.5
    gps_altitude_sigma_scale: 3.0
    gps_altitude_sigma_floor_m: 1.0
    gps_keyframe_max_gap_s: 1.2

    # Correction slew.
    correction_slew_mps: 0.2
    correction_slew_rps: 0.1
    large_correction_threshold_m: 1.0
